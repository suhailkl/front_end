        <div class=" ">

            <div  class="d-flex justify-content-center "><form action="">

                <div>

                    <input type="password" class="form-control " placeholder="password " required>
                </div>

                <div class="d-flex  justify-content-center align-item-center"><button class="btn btn-secondary w-50 mt-3"><a href="login.html"></a>SignUP</button></div>

            </div></form>
        </div>
